name: Render Video

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Install Linux Media & Browser Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libasound2 libatk-bridge2.0-0 libatk1.0-0 libcups2 libdrm2 libgbm1 libnss3 libxcomposite1 libxdamage1 libxrandr2

      - name: Render Video with Remotion
        run: npx remotion render SaveTheDate out/save-the-date.mp4

      - name: Upload Output Video
        uses: actions/upload-artifact@v4
        with:
          name: save-the-date-video
          path: out/save-the-date.mp4
          retention-days: 7
